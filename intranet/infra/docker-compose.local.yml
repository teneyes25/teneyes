services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: intranet
      POSTGRES_USER: intranet
      POSTGRES_PASSWORD: intranet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intranet -d intranet"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_LDAP_BIND_CREDENTIAL: change-me
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  ollama:
    image: ollama/ollama:latest
    network_mode: bridge
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      OLLAMA_FLASH_ATTENTION: "false"
      OLLAMA_LLM_LIBRARY: cpu
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    network_mode: bridge
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://intranet:intranet@host.docker.internal:5432/intranet
      CORS_ORIGIN: http://localhost:3000
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://192.168.0.6:3000,http://193.168.0.6:3000"
      AUTH_REQUIRED: "false"
      KEYCLOAK_ISSUER: http://host.docker.internal:8080/realms/maejong-intranet
      KEYCLOAK_AUDIENCE: intranet-api
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      SMTP_HOST: host.docker.internal
      SMTP_PORT: 1025
      SMTP_FROM: intranet@maejong.local
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: smollm2:135m
      INDUSTRY_NEWS_SCHEDULER_ENABLED: "true"
      INDUSTRY_NEWS_CRON: "0 9 * * 1-5"
      INDUSTRY_NEWS_TIMEZONE: Asia/Seoul
      INDUSTRY_NEWS_RSS_URL: "https://news.google.com/rss/search?q=%EC%9E%90%EB%8F%99%EC%B0%A8%20%EC%82%B0%EC%97%85&hl=ko&gl=KR&ceid=KR:ko"
      INDUSTRY_NEWS_MAX_CANDIDATES: 10
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started
      mailhog:
        condition: service_started
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  ollama-data:
